<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="jk-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="jk-antenna" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <!-- Soft shadow so the robot reads on light UI without a filled background -->
    <filter id="jk-shadow" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.16" result="s1"/>
      <feDropShadow in="SourceGraphic" dx="0" dy="2" stdDeviation="3" flood-color="#1e40af" flood-opacity="0.1" result="s2"/>
      <feMerge>
        <feMergeNode in="s1"/>
        <feMergeNode in="s2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#jk-shadow)">
    <!-- Antenna -->
    <line x1="128" y1="52" x2="128" y2="78" stroke="url(#jk-antenna)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="128" cy="44" r="14" fill="#fbbf24" stroke="#f59e0b" stroke-width="3"/>
    <!-- Head -->
    <rect x="56" y="78" width="144" height="112" rx="36" fill="url(#jk-metal)" stroke="#94a3b8" stroke-width="3"/>
    <!-- Face screen -->
    <rect x="72" y="98" width="112" height="72" rx="20" fill="#0f172a"/>
    <!-- Friendly eyes -->
    <ellipse cx="102" cy="128" rx="14" ry="18" fill="#e2e8f0"/>
    <ellipse cx="154" cy="128" rx="14" ry="18" fill="#e2e8f0"/>
    <circle cx="106" cy="128" r="8" fill="#1e40af"/>
    <circle cx="158" cy="128" r="8" fill="#1e40af"/>
    <circle cx="104" cy="124" r="3" fill="#fff" opacity="0.9"/>
    <circle cx="156" cy="124" r="3" fill="#fff" opacity="0.9"/>
    <!-- Smile -->
    <path d="M 108 158 Q 128 172 148 158" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <!-- Cheek glow -->
    <circle cx="88" cy="142" r="8" fill="#3b82f6" opacity="0.25"/>
    <circle cx="168" cy="142" r="8" fill="#3b82f6" opacity="0.25"/>
    <!-- Body -->
    <rect x="76" y="186" width="104" height="56" rx="20" fill="url(#jk-metal)" stroke="#94a3b8" stroke-width="3"/>
    <!-- Keyword badge on chest -->
    <rect x="96" y="198" width="64" height="32" rx="8" fill="#1e40af"/>
    <g stroke="#fff" stroke-width="3.5" stroke-linecap="round">
      <line x1="108" y1="202" x2="108" y2="226"/>
      <line x1="120" y1="202" x2="120" y2="226"/>
      <line x1="102" y1="210" x2="126" y2="210"/>
      <line x1="102" y1="218" x2="126" y2="218"/>
    </g>
    <!-- Arms -->
    <ellipse cx="48" cy="200" rx="16" ry="22" fill="url(#jk-metal)" stroke="#94a3b8" stroke-width="2" transform="rotate(-20 48 200)"/>
    <ellipse cx="208" cy="200" rx="16" ry="22" fill="url(#jk-metal)" stroke="#94a3b8" stroke-width="2" transform="rotate(20 208 200)"/>
  </g>
</svg>
